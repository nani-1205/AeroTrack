@if (shell()) {
  <div class="console">
    <aside class="sidebar" aria-label="Console navigation">
      <a routerLink="/" class="brand"><ui-logo class="on-dark" [markSize]="30" tag="Console" /></a>

      <nav>
        <span class="section">Monitoring</span>
        @for (item of navigation; track item.path) {
          <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.exact }" ariaCurrentWhenActive="page">
            <ui-icon [icon]="item.icon" [size]="17" /> {{ item.label }}
          </a>
        }
        <span class="section">Account</span>
        <a routerLink="/change-password" routerLinkActive="active" ariaCurrentWhenActive="page">
          <ui-icon [icon]="icons.KeyRound" [size]="17" /> Change password
        </a>
      </nav>

      <div class="me">
        <span class="initial">{{ auth.admin()!.username.slice(0, 1).toUpperCase() }}</span>
        <div class="id"><strong>{{ auth.admin()!.username }}</strong><span>Administrator</span></div>
        <button type="button" class="signout" (click)="auth.signOut()" title="Sign out" aria-label="Sign out">
          <ui-icon [icon]="icons.LogOut" [size]="16" />
        </button>
      </div>
    </aside>

    <main class="content">
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}

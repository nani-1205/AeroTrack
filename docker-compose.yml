# Local development infrastructure only (databases, cache, metrics).
# Credentials come from .env, which is GENERATED from config/services.json:
#   npm run setup      (first time)
#   npm run infra:up   (re-syncs .env, then starts and waits for healthy containers)
name: aerotrack

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTH_DB_SCHEMA: ${AUTH_DB_SCHEMA}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      TRACKING_DB_SCHEMA: ${TRACKING_DB_SCHEMA}
      TRACKING_DB_USER: ${TRACKING_DB_USER}
      TRACKING_DB_PASSWORD: ${TRACKING_DB_PASSWORD}
      ANALYTICS_DB_SCHEMA: ${ANALYTICS_DB_SCHEMA}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
      # Runs ONLY on first init of an empty volume: creates per-service roles + schemas.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    extra_hosts:
      # Services run on the host during development; Prometheus scrapes them from the container.
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  redisdata:
  promdata:
